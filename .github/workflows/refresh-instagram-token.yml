name: Продление токена Instagram

on:
  schedule:
    - cron: "0 6 1,15 * *"    # 1-го и 15-го числа каждого месяца
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Продлеваем токен и сохраняем в Secrets
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # личный токен GitHub с правом Secrets: Read and write на этот репозиторий
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          notify() { curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$TG_CHAT_ID" --data-urlencode text="$1" > /dev/null; }
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | jq -r '.access_token // empty')
          if [ -z "$NEW" ]; then notify "❌ GitHub: не удалось продлить токен Instagram. Получите новый и обновите секрет IG_TOKEN."; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW" || { notify "❌ GitHub: токен Instagram продлён, но не сохранён — проверьте секрет GH_PAT."; exit 1; }
          echo "Токен продлён"
