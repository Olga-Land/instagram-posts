name: Fetch approved deep male voiceover
on:
  push:
    paths:
      - '.github/workflows/fetch-deep-voice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect full generated audio source and download
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse, pathlib,re,html
          paths=[
            'https://www.aidocmaker.com/g0/audio?name=dcc1fd64d28a4299a9cb1579be690536',
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8e79e3c6-f819-4b61-aa99-82044f1fc64f.mp3',
          ]
          root=pathlib.Path('publications/audio');root.mkdir(parents=True,exist_ok=True)
          for idx,url in enumerate(paths):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=32) as r:
                      data=r.read(12000000)
                      print('FETCH',idx,'status',r.status,'ctype',r.headers.get('Content-Type'),'size',len(data),'url',r.url[:300],flush=True)
                      if data[:3]==b'ID3' or data[:2] in (b'\\xff\\xfb',b'\\xff\\xf3') or (r.headers.get('Content-Type','').startswith('audio/')):
                          dest=root/('deep_male_full.mp3' if idx==0 else 'deep_male_preview.mp3')
                          dest.write_bytes(data)
                      else:
                          t=data[:9000].decode('utf-8','ignore')
                          print('HTML_SNIPPET',t[:3500],flush=True)
                          candidates=re.findall(r'https?[^\\s\\"<>]+[.]mp3[^\\s\\"<>]*',t)
                          print('AUDIO_CANDIDATES',candidates[:5],flush=True)
              except Exception as e:
                  print('FAILED',idx,str(e)[:450],flush=True)
          PY
      - name: Commit valid audio files
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add publications/audio
          if ! git diff --cached --quiet; then
            git commit -m 'Import approved deep male narration'
            git pull --rebase
            git push
          fi
