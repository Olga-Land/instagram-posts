name: Отправка статуса Instagram в личный Telegram
on:
  push:
    paths:
      - 'notifications/instagram/*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send latest Instagram status notice
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,glob
          files=sorted(glob.glob('notifications/instagram/*.json'))
          if not files: raise SystemExit('No notices')
          name=files[-1]
          obj=json.load(open(name,encoding='utf-8'))
          if not obj.get('verified'): raise SystemExit('Unverified notice, not sent')
          text=obj.get('message','').strip()
          if not text or len(text)>1600: raise RuntimeError('Invalid notice')
          token=os.getenv('TG_BOT_TOKEN','')
          chat=os.getenv('TG_CHAT_ID','')
          if not token or not chat: raise RuntimeError('Telegram secret unavailable')
          url='https://api.telegram.org/bot'+token+'/sendMessage'
          req=urllib.request.Request(url,data=json.dumps({'chat_id':chat,'text':text}).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response: result=json.load(response)
          if not result.get('ok'): raise RuntimeError('Telegram rejected status')
          print('Instagram status sent to private Telegram')
          PY
