name: Проверка подключения Instagram
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверяем доступ к Instagram API без публикации
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${IG_TOKEN:-}" ]; then
            echo "::error::Не задан GitHub Secret IG_TOKEN"
            exit 1
          fi
          if [ -z "${IG_USER_ID:-}" ]; then
            echo "::error::Не задана GitHub Variable IG_USER_ID"
            exit 1
          fi
          BASE="${IG_API_BASE:-https://graph.facebook.com/v26.0}"
          BASE="${BASE%/}"
          echo "Проверяем профиль Instagram ID ${IG_USER_ID} через ${BASE}"
          BODY=$(curl --fail-with-body --silent --show-error --get "${BASE}/${IG_USER_ID}" \
            --data-urlencode "fields=username,account_type" \
            --data-urlencode "access_token=${IG_TOKEN}")
          echo "$BODY" | jq -e '.username' >/dev/null
          USERNAME=$(echo "$BODY" | jq -r '.username')
          TYPE=$(echo "$BODY" | jq -r '.account_type // "unknown"')
          if [ "$USERNAME" != "lab_of_landscape" ]; then
            echo "::error::Токен открыл другой аккаунт: @${USERNAME}"
            exit 1
          fi
          echo "::notice::Профиль подтверждён: @${USERNAME} (${TYPE})"
          MEDIA=$(curl --fail-with-body --silent --show-error --get "${BASE}/${IG_USER_ID}/media" \
            --data-urlencode "fields=id,media_type" --data-urlencode "limit=1" \
            --data-urlencode "access_token=${IG_TOKEN}")
          echo "$MEDIA" | jq -e 'has("data")' >/dev/null
          echo "::notice::Чтение Instagram Media API успешно. Ничего не опубликовано."
