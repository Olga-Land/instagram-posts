name: Проверка подключения Instagram
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/check-instagram.yml"
  schedule:
    - cron: "17 6 * * *" # ежедневная проверка без публикации
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверяем доступ к Instagram API без публикации
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_BASE: https://graph.facebook.com/v27.0
        run: |
          set -euo pipefail
          if [ -z "${IG_TOKEN:-}" ]; then
            echo "::error::Не задан GitHub Secret IG_TOKEN"
            exit 1
          fi
          BASE="${IG_API_BASE%/}"
          echo "Ищем аккаунт @lab_of_landscape среди активов, переданных через Unified Login"

          ASSETS=$(request "${BASE}/me/assigned_instagram_accounts" --data-urlencode "fields=id,username")
          IG_USER_ID=$(echo "$ASSETS" | jq -r --arg username "lab_of_landscape" '.data[]? | select((.username // "" | ascii_downcase) == ($username | ascii_downcase)) | .id' | head -n 1)
          if [ -z "$IG_USER_ID" ]; then
            echo "::error::Meta не передала аккаунт @lab_of_landscape в список доступных Instagram-активов." >&2
            echo "Проверьте разрешение business_management и выбор Instagram-аккаунта в конфигурации Unified Login." >&2
            exit 1
          fi
          echo "::notice::Аккаунт найден, ID: ${IG_USER_ID}"

          BODY=$(request "${BASE}/${IG_USER_ID}" --data-urlencode "fields=username")
          USERNAME=$(echo "$BODY" | jq -r '.username // empty')
          if [ "$USERNAME" != "lab_of_landscape" ]; then
            echo "::error::Токен подтвердил другой аккаунт или не подтвердил ожидаемый @lab_of_landscape"
            exit 1
          fi
          echo "::notice::Профиль подтверждён: @${USERNAME}"

          MEDIA=$(request "${BASE}/${IG_USER_ID}/media" \
            --data-urlencode "fields=id,media_type" --data-urlencode "limit=1")
          echo "$MEDIA" | jq -e 'has("data")' >/dev/null
          echo "::notice::Чтение Instagram Media API успешно. Ничего не опубликовано."
