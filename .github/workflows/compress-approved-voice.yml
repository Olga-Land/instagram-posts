name: Compress approved deep voice
on:
  push:
    paths:
      - '.github/workflows/compress-approved-voice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install audio encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert narration to voice-quality Opus
        run: |
          ffmpeg -hide_banner -loglevel error -y -i publications/audio/deep_male_25nov_full.mp3 -c:a libopus -b:a 24k -application voip -ar 24000 -ac 1 publications/audio/deep_male_25nov_compact.ogg
          ls -lh publications/audio/deep_male_25nov_compact.ogg
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/audio/deep_male_25nov_compact.ogg
          git commit -m 'Add compact high-quality approved voice'
          git pull --rebase
          git push
