name: Import final approved Instagram carousels
on:
  push:
    paths:
      - '.github/workflows/import-final-instagram.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact final artwork from public Yandex folder
        env:
          PUBLIC_KEY: https://disk.yandex.ru/d/p1kS4UaWgAm-BQ
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, pathlib, zipfile, io, shutil, sys
          base='https://cloud-api.yandex.net/v1/disk/public/resources'
          key=__import__('os').environ['PUBLIC_KEY']
          def api(path,params):
              url=path+'?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'FinalInstagramImporter/1.0'}),timeout=40) as r:
                  return json.load(r)
          def scan(path='',depth=0):
              if depth>6: return
              ofs=0
              while True:
                  args={'public_key':key,'limit':100,'offset':ofs}
                  if path: args['path']=path
                  res=api(base,args)
                  es=res.get('_embedded',{}); items=es.get('items',[])
                  for i in items:
                      if i['type']=='dir':
                          yield from scan(i['path'],depth+1)
                      elif i['type']=='file':
                          yield i
                  ofs+=len(items)
                  if not items or ofs>=es.get('total',ofs): break
          files=list(scan())
          print('Public Yandex files:',len(files)); print('NAMES:',[(f.get('path'),f.get('name')) for f in files])
          matches=[f for f in files if f['name'].lower()=='instagram_final_20-25_nov_2026.zip']
          if len(matches)!=1:
              print('FINAL_ARCHIVE_NOT_PRESENT; matching names:',[f['name'] for f in files if 'final' in f['name'].lower()])
              sys.exit(2)
          item=matches[0]
          href=api(base+'/download',{'public_key':key,'path':item['path']})['href']
          with urllib.request.urlopen(href,timeout=90) as r: payload=r.read(35*1024*1024)
          z=zipfile.ZipFile(io.BytesIO(payload))
          target=pathlib.Path('publications/2026-11/final')
          valid=[]
          for day in range(20,26):
              date=f'2026-11-{day:02d}'
              for idx in range(1,6):
                  suffix=f'{date}/slide_{idx:02d}.jpg'
                  members=[name for name in z.namelist() if name.endswith(suffix)]
                  if len(members)!=1: raise RuntimeError('Missing/ambiguous: '+suffix)
                  data=z.read(members[0])
                  if len(data)<50000: raise RuntimeError('Too small: '+suffix)
                  dest=target/date/f'slide_{idx:02d}.jpg'
                  dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              suffix=f'{date}/caption.txt'
              members=[name for name in z.namelist() if name.endswith(suffix)]
              if len(members)!=1: raise RuntimeError('Missing caption: '+suffix)
              caption=z.read(members[0]).decode('utf-8')
              if len(caption)<700: raise RuntimeError('Caption too short: '+suffix)
              (target/date/'caption.txt').write_text(caption,encoding='utf-8')
              valid.append(date)
          print('IMPORTED_FINAL',valid)
          PY
      - name: Commit final images to public image paths (not scheduled)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/2026-11/final
          if ! git diff --cached --quiet; then
            git commit -m 'Import approved six final Instagram carousels from Yandex'
            git pull --rebase
            git push
          fi
