name: Публикация по расписанию

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub иногда запаздывает на 5–15 минут)
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуска
  push:
    paths:
      - 'slides/**/post.yml'    # сразу проверить новые/одобренные посты, не ждать cron

concurrency:
  group: publish              # два запуска одновременно не публикуют дважды
  cancel-in-progress: false

permissions:
  contents: write             # чтобы записать ссылки в post.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q httpx python-dotenv pyyaml
      - name: Публикуем одобренные посты
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_BASE: https://graph.facebook.com/v27.0
          IG_USERNAME: lab_of_landscape
          IG_TOKEN_TYPE: facebook_login
          POST_TIMEZONE: Europe/Moscow
        run: python .github/scripts/publish.py
      - name: Сохраняем отметки о публикации
        run: |
          git config user.name "publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add slides
          git diff --cached --quiet && exit 0
          git commit -m "Опубликовано: отметки в post.yml"
          git pull --rebase
          git push

      - name: Уведомить о техническом сбое публикации в личный Telegram
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.getenv('TG_BOT_TOKEN')
          chat=os.getenv('TG_CHAT_ID')
          if not token or not chat:
              print('Telegram private notification not configured')
              raise SystemExit(0)
          msg='❌ Ошибка GitHub Actions при публикации «Лаборатории ландшафта». Проверь журнал: https://github.com/'+os.environ.get('GITHUB_REPOSITORY','Olga-Land/instagram-posts')+'/actions/runs/'+os.environ.get('GITHUB_RUN_ID','')
          url='https://api.telegram.org/bot'+token+'/sendMessage'
          data=json.dumps({'chat_id':chat,'text':msg}).encode()
          with urllib.request.urlopen(urllib.request.Request(url,data=data,headers={'Content-Type':'application/json'}),timeout=20) as response:
              result=json.load(response)
          if not result.get('ok'):
              raise RuntimeError('Telegram notification rejected')
          print('Private Telegram failure notice delivered')
          PY
