  <b>Разбор: дорожка как водосборник</b>
  
  <b>Что видим.</b> В конце длинной дорожки всегда мокрый газон.
  
  <b>Почему это важно.</b> Твёрдая поверхность быстро собирает осадки и направляет их к краю. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Выясните, в каком месте поток сходит с покрытия. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> Не перекладывайте всю воду в соседний цветник.
  
  Если путь воды не определён, выбор материалов пока преждевременен.
