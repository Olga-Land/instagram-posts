text: |
  <b>Коллекторный колодец: почему вода может остаться на участке даже после его установки?</b>

  Кажется, что решение очевидно: если вода скапливается, нужно собрать её в колодец. Но здесь есть важный нюанс.

  Коллекторный колодец принимает воду из труб и лотков и передаёт её дальше. Сам по себе он воду не убирает.

  Поэтому главный вопрос не только в том, где собрать воду, а в том, <b>куда она пойдёт после колодца</b>.

  Если у маршрута нет продолжения, вы можете просто перенести место скопления воды — и получить новую проблему.

  В полном гайде «После дождя участок превращается в болото» разбираем систему целиком: источник воды, её маршрут, место задержки и только потом выбор решения.

  <i>Завтра продолжим разбирать ошибки, которые кажутся простыми решениями.</i>
