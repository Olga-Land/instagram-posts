text: |
  <b>Один короткий ролик во время дождя помогает больше, чем десять фото лужи после.</b>
  
  При внешнем притоке важно увидеть точку входа воды и то, как поток меняет направление на участке. Потом это бывает трудно восстановить.
  
  <b>Мини-инструкция:</b> снимите непрерывное видео на 15–30 секунд: начните с места входа потока, медленно проведите камерой вдоль него и закончите в точке накопления. Снимайте с безопасного места, не заходя в затопленные участки.
  
  Такой ролик удобен для постановки задачи проектировщику. Но он ещё не отвечает на главный инженерный вопрос: куда допустимо отвести собранный объём.
