text: |
  <b>Грязная полоска на газоне — иногда полезнее самой лужи.</b>
  
  Тонкие следы песка, листьев и мелкого мусора после ливня помогают восстановить направление потока, даже когда вода уже ушла.
  
  <b>Маленькая задача:</b> сфотографируйте след до уборки, отметьте начало и конец полосы и направление на схеме. Если след пересекает газон в сторону понижения, это подсказка о поверхностном стоке.
  
  Один след не объясняет уровень грунтовых вод или работу дренажа. Зато позволяет не копать наугад там, где сначала надо разобраться с движением воды по поверхности.
