text: |
  <b>Лужа у дорожки — повод проверить три высоты.</b>
  
  Иногда проблема в нескольких сантиметрах: газон оказался ниже кромки мощения, а бордюр сплошной. Вода накапливается между препятствием и ближайшим понижением.
  
  <b>Маленькая задача:</b> приложите длинную ровную рейку поперёк дорожки и прилегающего газона. Посмотрите, какая поверхность выше, и зарисуйте простой поперечный профиль. Это позволит отделить видимый перепад от догадки.
  
  Рейка покажет локальную геометрию, но не докажет, куда можно выпустить воду. Для изменения рельефа потребуется проверить весь маршрут стока.
