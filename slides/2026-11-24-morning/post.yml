text: |
  <b>Вода у ступеней бывает следствием уклона всего одной площадки.</b>
  
  Снаружи мощение может выглядеть почти горизонтальным. Но для воды достаточно небольшого перепада, чтобы стекать к порогу.
  
  <b>Что можно проверить:</b> положите ровную рейку на площадку в направлении от дорожки к дому и используйте уровень, чтобы понять знак уклона. Цель — выяснить, куда по поверхности направляется вода, без демонтажа плитки.
  
  Если поток направлен к входу, не исправляйте его случайной подсыпкой возле стены: это может ухудшить условия у цоколя. При следах подтопления конструкций нужна очная оценка.
