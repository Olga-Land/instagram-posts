text: |
  <b>Мокрая полоса у цоколя не всегда означает одну и ту же проблему.</b>
  
  Вода может стекать к стене с площадки, переливаться через желоб или задерживаться в понижении возле дома. На фотографии после дождя причины выглядят похоже.
  
  <b>Одна полезная проверка:</b> во время следующего дождя наблюдайте за ближайшей водосточной трубой, не подходя под поток и не трогая оборудование. Вода выходит из штатного выпуска или переливается сверху через желоб?
  
  Эта простая разница помогает отделить неисправность водостока от проблемы уклонов. При намокании стены или попадании воды внутрь требуется обследование, а не косметическая засыпка.
