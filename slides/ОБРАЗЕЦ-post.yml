# Образец. Скопируйте этот файл в папку поста (например slides/2026-11-20/) и назовите post.yml.
# Картинки .jpg из той же папки публикуются по алфавиту (slide_01, slide_02, ...).

approved: false                 # поставьте true — только тогда пост опубликуется
publish_at: 2026-11-20 10:00    # дата и время по Москве
telegram: true                  # публиковать в Telegram-канал
instagram: true                 # публиковать в Instagram (1 картинка = фото, 2–10 = карусель)
story: false                    # true = в Instagram только сторис из первой картинки
text: |
  Текст поста.
  Можно в несколько строк. В Telegram работает <b>жирный</b> и <i>курсив</i>.

# Ниже робот сам допишет ссылки после публикации — не удаляйте их, иначе пост выйдет повторно.
