  <b>Разбор: откуда приходит первая струя</b>
  
  <b>Что видим.</b> В мокрый день вода появляется сразу у входа.
  
  <b>Почему это важно.</b> Внешний поток может пересекать границу участка. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Отметьте точку, где след воды впервые пересёк границу. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> Не начинайте с засыпки лужи.
  
  Сохраните наблюдение: одна точная запись полезнее догадки о «плохом грунте».
