text: |
  <b>Для первой схемы воды не нужен AutoCAD.</b>
  
  Возьмите план участка или лист бумаги. Нарисуйте контур дома, дорожку и место, где после дождя заметен поток.
  
  <b>Практика на пять минут:</b> отметьте одну стрелку от источника воды до места скопления; поставьте крестик там, где течение останавливается. Подпишите, что наблюдали лично, а что пока только предполагаете.
  
  Эта схема решает маленькую, но важную задачу: отделяет факт от догадки. Следующий шаг сложнее — определить, куда вода может уйти без ущерба дому, растениям и соседним территориям.
