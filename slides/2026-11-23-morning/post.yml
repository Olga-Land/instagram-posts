text: |
  <b>У забора намыло песок, хотя рядом нет водостока.</b>
  
  Так бывает, когда поверхностный поток попадает на участок с более высокой территории или дороги. После дождя остаётся тонкий веер наносов у нижней кромки ограждения.
  
  <b>Полезное наблюдение:</b> отметьте, где след впервые пересёк линию забора, и снимите его рядом с постоянным ориентиром — столбом или калиткой. Повторите фото после следующего дождя.
  
  Две съёмки помогут понять, повторяется ли маршрут. Но перенаправлять воду за границу участка без проекта и проверки последствий нельзя.
