text: |
  <b>Три миллиметра дождя — не обязательно «совсем немного».</b>
  
  На 100 м² горизонтальной проекции крыши 3 мм осадков соответствуют примерно 300 литрам воды до учёта потерь. Часть объёма уходит через отдельные трубы, и возле одного выпуска нагрузка может быть заметной.
  
  <b>Полезный мини-расчёт:</b> умножьте площадь водосбора в квадратных метрах на количество осадков в миллиметрах. Получите ориентировочный объём в литрах. Например, 40 м² × 5 мм = 200 л.
  
  Эта оценка не заменяет расчёт ливневой системы: важно не только сколько воды выпадает, но и насколько быстро она поступает и есть ли путь для отвода.
