  <b>Вода у ступеней: какая деталь выдаёт проблему?</b>
  
  Участок рассказывает о воде через детали, которые легко не заметить. Представьте: после ливня вода стекает к крыльцу. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  Вечером разберём, что именно проверить и какой вывод пока делать нельзя.
