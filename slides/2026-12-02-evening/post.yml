  <b>Разбор: бордюр как плотина</b>
  
  <b>Что видим.</b> Лужа стоит вдоль дорожки.
  
  <b>Почему это важно.</b> Бордюр может перекрывать естественный выход поверхностного стока. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Сравните высоту газона, дорожки и бордюра. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> Не удаляйте бордюр до понимания, куда пойдёт поток.
  
  Начните с наблюдения. Решение должно работать для всей цепочки движения воды.
