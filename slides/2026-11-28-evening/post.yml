  <b>Разбор: почему рядом с водостоком грязь</b>
  
  <b>Что видим.</b> Под трубой постоянно появляется промоина.
  
  <b>Почему это важно.</b> Весь объём с части крыши выходит компактной струёй. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Посмотрите, куда попадает вода в первые секунды ливня. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> Защита от размыва не заменяет маршрута отвода.
  
  Начните с наблюдения. Решение должно работать для всей цепочки движения воды.
