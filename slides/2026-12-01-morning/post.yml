  <b>Дорожка как водосборник: какая деталь выдаёт проблему?</b>
  
  Есть незаметный признак, который часто пропускают при осмотре участка. Представьте: в конце длинной дорожки всегда мокрый газон. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  Во второй публикации покажу последовательность проверки без ненужных покупок.
