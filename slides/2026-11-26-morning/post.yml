  <b>Откуда приходит первая струя: какая деталь выдаёт проблему?</b>
  
  Есть незаметный признак, который часто пропускают при осмотре участка. Представьте: в мокрый день вода появляется сразу у входа. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  Вечером разберём, что именно проверить и какой вывод пока делать нельзя.
