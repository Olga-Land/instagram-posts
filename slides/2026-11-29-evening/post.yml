  <b>Разбор: один водосток — одна задача</b>
  
  <b>Что видим.</b> С одной стороны дома сухо, а с другой мокро.
  
  <b>Почему это важно.</b> Разные трубы отводят воду в разные точки участка. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Обойдите каждую водосточную трубу отдельно. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> Работа одной трубы не доказывает исправность остальных.
  
  Небольшая схема на бумаге часто предотвращает лишние земляные работы.
