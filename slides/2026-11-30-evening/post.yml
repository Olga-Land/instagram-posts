  <b>Разбор: вода у ступеней</b>
  
  <b>Что видим.</b> После ливня вода стекает к крыльцу.
  
  <b>Почему это важно.</b> Площадка или дорожка могут быть наклонены в сторону дома. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Проследите струйку по швам плитки до первой низкой точки. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> При признаках подтопления цоколя нужна очная оценка.
  
  Сохраните наблюдение: одна точная запись полезнее догадки о «плохом грунте».
