text: |
  <b>У лужи почти всегда есть история. И начинается она не в самой луже.</b>

  После дождя мы видим мокрое пятно на газоне и сразу думаем: здесь плохой грунт, значит, нужен дренаж. Но один и тот же результат могут дать совершенно разные причины: вода пришла с дороги, вылилась из водостока или упёрлась в бордюр.

  Попробуйте необычную проверку: не смотрите сначала на место скопления. Найдите <b>первую видимую точку, откуда вода начинает двигаться</b>. Потом проследите её путь до лужи.

  Если осмотреть участок только на следующий день, ключевой след может исчезнуть.

  В ближайшие дни разберём три ошибки, из-за которых воду на участке пытаются лечить не в том месте.

  А вы чаще замечаете воду у дома, на дорожках или на газоне?
