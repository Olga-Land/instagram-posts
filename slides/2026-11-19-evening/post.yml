text: |
  <b>Чистая парковка после дождя — не всегда сухой участок.</b>
  
  На плотном покрытии вода часто не задерживается: она стекает к краю и может собираться у крыльца. Кажется, что проблема у дома, хотя поток начинается на въезде.
  
  <b>Маленькая проверка:</b> во время дождя положите у края парковки две небольшие метки — там, где вода впервые сходит с покрытия, и там, где она оказывается у дорожки. Запишите направление на схеме участка. Мощение разбирать не нужно.
  
  Если поток действительно идёт к дому, это уже конкретная задача для корректировки поверхностного стока. Но прежде чем менять уклон или ставить лоток, важно понять, где вода сможет безопасно закончить свой путь.
