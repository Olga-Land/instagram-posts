text: |
  <b>Почему вода с парковки иногда оказывается у входа в дом?</b>

  Представьте: на въезде ровное мощение, после дождя на нём почти нет луж. Кажется, всё устроено правильно. Но у крыльца появляется грязная полоса.

  Возможная причина — покрытие <b>не задерживает воду, а быстро переносит её</b>. Даже небольшого перепада высот достаточно, чтобы поток пошёл вдоль шва, края дорожки или подпорной кромки.

  Во время дождя посмотрите не на саму лужу, а на место, где заканчивается парковка: куда направлены тонкие струйки? Не ведёт ли их бордюр к дому?

  <b>Не нужно ничего разбирать.</b> Снимите 15 секунд видео с потоком. Завтра перейдём к другой поверхности, которая собирает воду с большой площади, — крыше.

  А где после дождя вода движется быстрее: на въезде или на дорожках?
