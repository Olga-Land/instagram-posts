text: |
  <b>Бордюр может держать воду не хуже маленькой плотины.</b>
  
  После устройства дорожки вдоль её края иногда появляется узкая мокрая полоса. Бордюр перекрыл прежний поверхностный сток, и воде некуда пройти.
  
  <b>Проверка за две минуты:</b> после дождя осмотрите всю линию мокрой полосы. Самая глубокая лужа не всегда показывает место преграды. Найдите участок бордюра, перед которым вода собирается сплошной линией, и отметьте его на плане.
  
  Не стоит сразу вынимать плитку или делать прорезь: вода должна выйти не просто «куда-нибудь», а туда, где не затопит другую зону.
