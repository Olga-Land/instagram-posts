  <b>Дорога выше участка: какая деталь выдаёт проблему?</b>
  
  Проблема может быть совсем не там, где стоит вода. Представьте: после сильного дождя у ворот образуется ручей. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  Во второй публикации покажу последовательность проверки без ненужных покупок.
