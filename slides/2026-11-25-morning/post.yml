text: |
  <b>Лучшее фото проблемного участка — не обязательно самое красивое.</b>
  
  Снимок крупной лужи показывает её размер, но часто не объясняет, откуда пришла вода. Для диагностики полезнее фотография, где в кадре видны источник, дорожка и место накопления.
  
  <b>Маленький приём:</b> сделайте два кадра с одной точки: общий — со всеми ориентирующими объектами, и крупный — со следами течения или размыва. Запишите дату и время после начала дождя.
  
  Этого уже достаточно, чтобы сравнить несколько дождей и не полагаться на память. А выбор конструкции водоотвода требует гораздо более полной картины участка.
