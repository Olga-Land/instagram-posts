  <b>Разбор: дорога выше участка</b>
  
  <b>Что видим.</b> После сильного дождя у ворот образуется ручей.
  
  <b>Почему это важно.</b> Покрытие дороги собирает сток и отправляет вниз по рельефу. Чтобы отличить вероятную причину от следствия, нужна проверка движения воды именно в дождь.
  
  <b>Что сделать.</b> Во время дождя посмотрите на линию въезда и край дороги. Отметьте на схеме источник, путь и место остановки воды.
  
  <b>Граница решения.</b> Не направляйте воду обратно на соседнюю территорию без проверки.
  
  Если путь воды не определён, выбор материалов пока преждевременен.
