text: |
  <b>Один водосток способен намочить газон сильнее всего дождя.</b>
  
  Кровля собирает воду с большой площади, а труба сбрасывает её в одну точку. Именно там появляются размыв грунта, оголённые корни травы и грязная полоса.
  
  <b>Что можно исправить без земляных работ:</b> проверьте, не направлен ли выпуск прямо на открытый грунт. Если так, временно защитите место падения воды подходящим водоотводящим элементом, направив струю от фундамента и не к соседям. Не перекрывайте трубу.
  
  Это помогает уменьшить локальный размыв. Но если вода после выпуска остаётся возле дома, одной защиты грунта недостаточно.
