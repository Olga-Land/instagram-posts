  <b>Почему рядом с водостоком грязь: какая деталь выдаёт проблему?</b>
  
  После дождя полезно смотреть не только на саму лужу. Представьте: под трубой постоянно появляется промоина. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  Позже сегодня разложим ситуацию на источник, маршрут и точку остановки.
