  <b>Один водосток — одна задача: какая деталь выдаёт проблему?</b>
  
  Один небольшой эпизод во время дождя иногда показывает больше, чем осмотр на следующий день. Представьте: с одной стороны дома сухо, а с другой мокро. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  В вечернем посте — проверка, которая поможет не перепутать причину со следствием.
