text: |
  <b>Два соседних участка газона могут высыхать с разной скоростью.</b>
  
  На одном месте солнце и ветер подсушивают верхний слой, а под кустарниками и в тени влага держится дольше. Но постоянная сырость может быть связана и с понижением рельефа или притоком воды.
  
  <b>Простой тест наблюдения:</b> сфотографируйте границу мокрого пятна сразу после дождя и на следующие сутки с одной точки. Сравните, как меняется её форма.
  
  Если пятно постепенно уменьшается, это одно наблюдение. Если зона остаётся одинаково мокрой несколько сухих дней, потребуется искать не только поверхностный сток.
