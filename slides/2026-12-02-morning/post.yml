  <b>Бордюр как плотина: какая деталь выдаёт проблему?</b>
  
  Проблема может быть совсем не там, где стоит вода. Представьте: лужа стоит вдоль дорожки. Первое желание — исправить именно это место. Но причина не обязательно находится там, где заметнее всего последствия.
  
  Сегодня попробуйте ответить на один вопрос: откуда вода пришла в эту точку? Не покупайте ничего и не меняйте рельеф до наблюдения.
  
  Позже сегодня разложим ситуацию на источник, маршрут и точку остановки.
